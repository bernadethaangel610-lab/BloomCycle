plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.bloomcycle.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.bloomcycle.app'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'

        def supabaseUrl = (project.findProperty('supabaseUrl') ?: System.getenv('SUPABASE_URL') ?: '').toString()
        def supabaseKey = (project.findProperty('supabaseKey') ?: System.getenv('SUPABASE_KEY') ?: '').toString()
        buildConfigField 'String', 'SUPABASE_URL', "\"${supabaseUrl.replace('"', '\\"')}\""
        buildConfigField 'String', 'SUPABASE_KEY', "\"${supabaseKey.replace('"', '\\"')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Supabase & Ktor dependencies
    implementation platform('io.github.jan-tennert.supabase:bom:2.4.0')
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:gotrue-kt'
    implementation 'io.github.jan-tennert.supabase:realtime-kt'
    implementation 'io.ktor:ktor-client-android:2.3.11'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
